<!doctype html>
<html lang="pt-BR" class="th-mallard">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mallard</title>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/shell.css">
  <link rel="stylesheet" href="css/shell.css">
</head>
<body>
  <div class="shell">
    <header class="topbar" id="topbar">
      <button type="button" class="brand" id="brand-logo" aria-label="Mallard"></button>
      <nav class="tabs" id="tabs" aria-label="Navegação principal"></nav>
      <div class="top-right">
        <button type="button" class="ai-chip" id="ai-chip" data-page="settings" title="Chave do Gemini">
          <span id="ai-dot" class="ai-dot"></span><span id="ai-text">IA: chave não informada</span>
        </button>
        <button type="button" class="round-btn" id="help-btn" aria-label="Como usar esta tela" title="Como usar esta tela">?</button>
        <button type="button" class="round-btn" id="settings-btn" data-page="settings" aria-label="Configurações" title="Configurações"></button>
      </div>
    </header>
    <main class="content" id="content">
      <section class="page" id="page-computer" aria-label="Meu PC"></section>
      <section class="page" id="page-guide" aria-label="Entender"></section>
      <section class="page" id="page-simulator" aria-label="Simulador de upgrade"></section>
      <section class="page" id="page-monitor" aria-label="Monitor"></section>
      <section class="page" id="page-journal" aria-label="Diário do PC"></section>
      <section class="page" id="page-gamecheck" aria-label="Vai rodar?"></section>
      <section class="page" id="page-advisor" aria-label="Consultor de upgrades"></section>
      <section class="page" id="page-analyzing" aria-label="Analisando"></section>
      <section class="page" id="page-result" aria-label="Resultado da análise"></section>
      <section class="page" id="page-error" aria-label="Não deu para analisar"></section>
      <section class="page" id="page-history" aria-label="Histórico"></section>
      <section class="page" id="page-cleanup" aria-label="Limpeza"></section>
      <section class="page" id="page-startup" aria-label="Inicialização"></section>
      <section class="page" id="page-temperature" aria-label="Temperatura"></section>
      <section class="page" id="page-battery" aria-label="Bateria"></section>
      <section class="page" id="page-settings" aria-label="Configurações"></section>
    </main>
  </div>
  <div class="intro" id="intro" hidden></div>
  <div class="help-layer" id="help-layer" hidden></div>
  <div class="toast-root" id="toast-root" aria-live="polite"></div>

  <script src="js/icons.js"></script>
  <script src="js/bridge.js"></script>
  <script src="js/app.js"></script>
  <script src="js/help.js"></script>
  <script src="js/pages/computer.js"></script>
  <script src="js/pages/guide.js"></script>
  <script src="js/pages/simulator.js"></script>
  <script src="js/pages/monitor.js"></script>
  <script src="js/pages/journal.js"></script>
  <script src="js/pages/gamecheck.js"></script>
  <script src="js/pages/advisor.js"></script>
  <script src="js/pages/analyzing.js"></script>
  <script src="js/pages/result.js"></script>
  <script src="js/pages/error.js"></script>
  <script src="js/pages/beforeafter.js"></script>
  <script src="js/pages/history.js"></script>
  <script src="js/pages/cleanup.js"></script>
  <script src="js/pages/startup.js"></script>
  <script src="js/pages/temperature.js"></script>
  <script src="js/pages/battery.js"></script>
  <script src="js/pages/settings.js"></script>
  <script src="js/pages/intro.js"></script>
  <script>App.start();</script>
</body>
</html>
